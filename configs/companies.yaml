sector: Semiconductors & Semiconductor Equipment
sector_rationale: Same-sector filers share vocabulary (wafer, foundry, design win, inventory digestion)
  and report comparable metrics, so cross-company queries are meaningful. The 2022-2025 window spans both
  the 2023 memory/analog downturn and the AI-accelerator boom, producing large real revenue swings in
  both directions -- which is what makes type-D ('largest decline, and why?') queries have verifiable,
  non-trivial answers.
