ingest:
  sector: "Semiconductors & Semiconductor Equipment"
  fiscal_years: [2022, 2023, 2024, 2025]
  forms: ["10-K", "10-Q"]
  sec_rate_limit_per_sec: 8.0
  # See design/01_data.md — as-originally-filed. Gold answers use the same convention.
  restatement_policy: point_in_time
  min_section_chars: 400

chunk:
  strategy: section_aware
  target_tokens: 320
  overlap_tokens: 64
  embed_model: "BAAI/bge-small-en-v1.5"
  embed_batch_size: 128

llm:
  generator_model: "qwen2.5:7b-instruct"
  judge_model: "llama3.1:8b"
  temperature: 0.0
  seed: 1337

sql:
  default_limit: 50
  max_rows: 200
  statement_timeout_ms: 10000
  self_correct_attempts: 1

retrieval:
  k: 8
  candidate_k: 40
  use_reranker: false

eval:
  bootstrap_samples: 2000
  min_cell_n: 25
